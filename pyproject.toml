[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-parkinsonism"
version = "0.1.0"
description = "Global Executive Control and token-efficiency benchmark for persistent LLM agent loops"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Dongsheng Xiao"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
llm-parkinsonism = "llm_parkinsonism.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
